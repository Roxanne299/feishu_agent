# 仓库里只放非敏感的默认值。
# 密钥走环境变量（见文件末尾清单），或项目根目录的 config/application.yml（已 gitignore）。

server:
  port: ${PORT:8080}

logging:
  level:
    io.agentscope: INFO
    com.example.feishuagent: INFO

# 下面这些键不写在仓库里，由环境变量注入（Spring Boot relaxed binding 自动映射）：
#
#   模型（二选一）
#     LLM_BASE_URL              -> llm.base-url     OpenAI 兼容端点，配了它就优先
#     LLM_API_KEY               -> llm.api-key
#     LLM_MODEL                 -> llm.model
#     AGENT_MODEL               -> agent.model      如 dashscope:qwen-plus，不配 LLM_BASE_URL 时生效
#
#   飞书
#     FEISHU_APP_ID             -> feishu.app-id
#     FEISHU_APP_SECRET         -> feishu.app-secret
#     FEISHU_VERIFICATION_TOKEN -> feishu.verification-token
#     FEISHU_ENCRYPT_KEY        -> feishu.encrypt-key   飞书后台开了加密才需要
#
#   可选
#     PORT                      -> server.port
#     AGENT_SYS_PROMPT          -> agent.sys-prompt  不配则用 AgentProperties 里的默认值
